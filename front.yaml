import math
from statistics import median

import rclpy
from rclpy.node import Node
from rclpy.qos import qos_profile_sensor_data
from sensor_msgs.msg import LaserScan
from std_msgs.msg import Float32


class FrontDistanceNode(Node):
    def __init__(self):
        super().__init__('front_distance_node')

        scan_topic = self.declare_parameter('scan_topic', '/scan').value
        front_deg = self.declare_parameter('front_angle_deg', 0.0).value
        self.front_angle = math.radians(front_deg)
        self.half_width = math.radians(5.0)

        self.distance_pub = self.create_publisher(Float32, '/dist_front', 10)
        self.scan_sub = self.create_subscription(
            LaserScan, scan_topic, self.on_scan, qos_profile_sensor_data
        )
        self.get_logger().info(f'{scan_topic} の受信を待っています')

    def on_scan(self, scan):
        front_distances = []

        for index, distance in enumerate(scan.ranges):
            if not math.isfinite(distance) or distance <= 0.0:
                continue
            if not scan.range_min <= distance <= scan.range_max:
                continue

            angle = scan.angle_min + index * scan.angle_increment
            offset = math.remainder(angle - self.front_angle, math.tau)
            if abs(offset) <= self.half_width:
                # 斜めの測距値を車体の前方向に投影する。
                front_distances.append(distance * math.cos(offset))

        if not front_distances:
            self.distance_pub.publish(Float32(data=float('nan')))
            self.get_logger().warning(
                'スキャンは届いていますが、正面に有効な測距値がありません',
                throttle_duration_sec=1.0,
            )
            return

        distance_m = float(median(front_distances))
        self.distance_pub.publish(Float32(data=distance_m))
        self.get_logger().info(
            f'正面の壁まで {distance_m * 100:.1f} cm',
            throttle_duration_sec=1.0,
        )


def main(args=None):
    rclpy.init(args=args)
    node = FrontDistanceNode()
    try:
        rclpy.spin(node)
    except KeyboardInterrupt:
        pass
    finally:
        node.destroy_node()
        if rclpy.ok():
            rclpy.shutdown()


if __name__ == '__main__':
    main()