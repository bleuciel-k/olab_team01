import cv2
import rclpy

from cv_bridge import CvBridge, CvBridgeError
from rclpy.node import Node
from rclpy.qos import qos_profile_sensor_data
from sensor_msgs.msg import Image
from std_msgs.msg import String


def detect_sign(image):
    """標識のラベルと、画面表示用の検出位置を返す。"""
    gray = cv2.cvtColor(image, cv2.COLOR_BGR2GRAY)
    blurred = cv2.GaussianBlur(gray, (5, 5), 0)
    _, binary = cv2.threshold(
        blurred, 0, 255, cv2.THRESH_BINARY_INV | cv2.THRESH_OTSU
    )

    contours, _ = cv2.findContours(
        binary, cv2.RETR_EXTERNAL, cv2.CHAIN_APPROX_SIMPLE
    )

    height, width = gray.shape
    image_area = height * width

    for contour in sorted(contours, key=cv2.contourArea, reverse=True):
        area = cv2.contourArea(contour)
        if not 0.002 * image_area <= area <= 0.50 * image_area:
            continue

        x, y, w, h = cv2.boundingRect(contour)

        # 画面の端で切れている候補は除外する。
        if x == 0 or y == 0 or x + w == width or y + h == height:
            continue

        perimeter = cv2.arcLength(contour, True)
        polygon = cv2.approxPolyDP(contour, 0.02 * perimeter, True)
        vertices = polygon.reshape(-1, 2)
        box = (x, y, w, h)

        if len(vertices) == 4 and cv2.isContourConvex(polygon):
            if not 0.65 <= w / h <= 1.55:
                continue

            # 各頂点の位置を外接矩形の中で 0〜1 に正規化する。
            points = [
                ((px - x) / (w - 1), (py - y) / (h - 1))
                for px, py in vertices
            ]
            top = min(points, key=lambda point: point[1])
            bottom = max(points, key=lambda point: point[1])
            left = min(points, key=lambda point: point[0])
            right = max(points, key=lambda point: point[0])

            if (
                0.25 <= top[0] <= 0.75
                and 0.25 <= bottom[0] <= 0.75
                and 0.25 <= left[1] <= 0.75
                and 0.25 <= right[1] <= 0.75
            ):
                return 'DIAMOND', box

        # 塗りつぶされた矢印は、軸と矢じりの境目にへこみがある。
        if len(vertices) != 7 or cv2.isContourConvex(polygon) or w < h:
            continue

        # 候補の輪郭だけを塗りつぶし、他の黒い部分の影響を除く。
        mask = binary[y:y + h, x:x + w].copy()
        mask.fill(0)
        local_contour = contour.copy()
        local_contour[:, :, 0] -= x
        local_contour[:, :, 1] -= y
        cv2.drawContours(mask, [local_contour], -1, 255, cv2.FILLED)

        # 先端付近と、少し内側の黒い部分の高さを比べる。
        left_tip = cv2.countNonZero(mask[:, int(0.08 * w)])
        left_inner = cv2.countNonZero(mask[:, int(0.25 * w)])
        right_tip = cv2.countNonZero(mask[:, int(0.92 * w)])
        right_inner = cv2.countNonZero(mask[:, int(0.75 * w)])

        points_left = left_inner - left_tip >= 0.15 * h
        points_right = right_inner - right_tip >= 0.15 * h

        if points_left and not points_right:
            return 'LEFT', box
        if points_right and not points_left:
            return 'RIGHT', box

    return 'NONE', None


class ImageSubscriber(Node):
    def __init__(self):
        super().__init__('image_subscriber')

        self.declare_parameter('show_image', True)
        self.show_image = self.get_parameter('show_image').value
        self.bridge = CvBridge()

        self.sign_publisher = self.create_publisher(
            String, '/sign_direction', 10
        )
        self.subscription = self.create_subscription(
            Image,
            '/image_raw',
            self.listener_callback,
            qos_profile_sensor_data,
        )

    def listener_callback(self, msg):
        try:
            image = self.bridge.imgmsg_to_cv2(msg, desired_encoding='bgr8')
        except CvBridgeError as error:
            self.get_logger().error(f'Failed to convert image: {error}')
            return

        label, box = detect_sign(image)

        result = String()
        result.data = label
        self.sign_publisher.publish(result)

        if self.show_image:
            if box is not None:
                x, y, w, h = box
                cv2.rectangle(image, (x, y), (x + w, y + h), (0, 255, 0), 2)

            cv2.putText(
                image, label, (15, 30), cv2.FONT_HERSHEY_SIMPLEX,
                0.8, (0, 255, 0), 2
            )
            cv2.imshow('Camera Sign Detection', image)
            cv2.waitKey(1)


def main(args=None):
    rclpy.init(args=args)
    node = ImageSubscriber()
    try:
        rclpy.spin(node)
    except KeyboardInterrupt:
        pass
    finally:
        if node.show_image:
            cv2.destroyAllWindows()
        node.destroy_node()
        if rclpy.ok():
            rclpy.shutdown()


if __name__ == '__main__':
    main()